<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>机会归档 · 学术新星机会雷达</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel-2:#1d212a; --border:#2a2f3a;
    --text:#e8eaed; --muted:#9aa3b2; --accent:#5b8def;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:linear-gradient(180deg,#0f1115 0%, #10131a 100%); color:var(--text);
    line-height:1.6;
  }
  header, main, footer{ max-width:1080px; margin:0 auto; padding:0 24px; }
  header{ padding-top:48px; padding-bottom:24px; }
  header h1{ font-size:24px; margin:0 0 8px; }
  header p{ color:var(--muted); margin:0 0 12px; font-size:14px; }
  header a{ color:var(--accent); text-decoration:none; font-size:14px; }
  header a:hover{ text-decoration:underline; }
  .card{
    background:var(--panel); border:1px solid var(--border); border-radius:var(--radius);
    padding:18px 20px; margin-bottom:12px;
  }
  .card h3{ margin:0 0 6px; font-size:16px; }
  .meta{ color:var(--muted); font-size:13px; margin-bottom:8px; }
  .note{ font-size:14px; color:#c7cbd4; background:var(--panel-2); border-left:3px solid var(--accent);
    padding:10px 14px; border-radius:8px; margin-top:8px; }
  .card a.link{ display:inline-block; margin-top:10px; color:var(--accent); text-decoration:none; font-size:13px; }
  footer{ padding:20px 24px 60px; color:var(--muted); font-size:13px; border-top:1px solid var(--border); margin-top:24px; }
  .empty{ color:var(--muted); text-align:center; padding:60px 0; }
</style>
</head>
<body>
<header>
  <h1>机会归档</h1>
  <p>已过期超过 7 天、从主看板移出的条目。归档更新：<span id="archive-date"></span></p>
  <a href="index.html">← 返回主看板</a>
</header>
<main id="list"></main>
<footer>归档仅供个人回溯，重要信息请以各官网为准。</footer>
<script src="data/archive.js"></script>
<script>
  document.getElementById('archive-date').textContent = ARCHIVE_UPDATED;
  const list = document.getElementById('list');
  const items = (typeof ARCHIVED_OPPORTUNITIES !== 'undefined' ? ARCHIVED_OPPORTUNITIES : []).slice();
  if(items.length === 0){
    list.innerHTML = '<div class="empty">暂无归档条目。</div>';
  } else {
    for(const item of items){
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <h3>${item.title}</h3>
        <div class="meta">${item.type} · ${item.status} · 原截止：${item.deadline}</div>
        <div class="note">${item.note || ''}</div>
        <a class="link" href="${item.link}" target="_blank" rel="noopener">查看官方信息 →</a>
      `;
      list.appendChild(card);
    }
  }
</script>
</body>
</html>
